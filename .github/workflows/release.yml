name: Publish release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/releases/1.0.0-approved.md', 'docs/releases/1.1.1-approved.md', 'docs/releases/2.0.0-approved.md']
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  lifecycle:
    uses: ./.github/workflows/joomla-lifecycle.yml
  web-upload:
    uses: ./.github/workflows/web-package-upload.yml
  publish:
    needs: [quality, lifecycle, web-upload]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source and build
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF" = refs/heads/main
            [[ "$version" == 1.0.0 || "$version" == 1.1.1 || "$version" == 2.0.0 ]]
            test -f "docs/releases/$version-approved.md"
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 tools/package.py
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            # Explicit stable approval on main; never overwrite a release.
            [[ "$version" == 1.0.0 || "$version" == 1.1.1 || "$version" == 2.0.0 ]]
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release already exists; refusing to replace immutable assets."
              exit 1
            fi
            gh release create "$tag" dist/*.zip dist/updates.xml --target "$GITHUB_SHA" --latest --title "Opera+ Extensions $version" --notes-file "docs/releases/$version-approved.md"
          elif [[ "$version" == 0.* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --prerelease --latest=false --title "Opera+ Extensions $version (preview)" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/updates.xml --verify-tag --latest --title "Opera+ Extensions $version" --generate-notes
          fi
      - name: Verify public stable update feed and package
        if: (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v0.')) || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          # The latest redirect can briefly serve the preceding release.
          for attempt in {1..12}; do
            if curl --fail --location --max-time 30 -o "$RUNNER_TEMP/public-updates.xml" https://github.com/jeckodevelopment/operaplus-extensions/releases/latest/download/updates.xml && cmp -s dist/updates.xml "$RUNNER_TEMP/public-updates.xml"; then
              break
            fi
            sleep 10
          done
          cmp dist/updates.xml "$RUNNER_TEMP/public-updates.xml"
          curl --fail --location --retry 5 --retry-all-errors --max-time 120 -o "$RUNNER_TEMP/public-package.zip" "https://github.com/jeckodevelopment/operaplus-extensions/releases/download/v$version/pkg_operaplus-$version.zip"
          cmp "dist/pkg_operaplus-$version.zip" "$RUNNER_TEMP/public-package.zip"
          python3 - <<'PY'
          import hashlib, os, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          update=ET.parse(root/'public-updates.xml').getroot().find('update')
          assert update.findtext('sha256') == hashlib.sha256((root/'public-package.zip').read_bytes()).hexdigest()
          assert update.findtext('client') == 'site'
          assert update.findtext('tags/tag') == 'stable'
          print('Public stable feed and package checksum verified.')
          PY
