name: Joomla extension CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find lib_operaplus mod_operaplus_atlas plg_fields_operaplusatlas mod_operaplus_cta plg_editorsxtd_operaplus_templates plg_system_operaplus_masthead tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: |
          php tests/index.php
          php tests/cta.php
          node tests/editor-templates.mjs
      - name: Validate manifests and build ZIPs
        run: python3 tools/package.py
      - name: Browser layout checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p dist/visual
          php tests/render-boxes.php > dist/visual/boxes.html
          node tests/visual-boxes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: operaplus-extensions-preview
          path: |
            dist/*.zip
            dist/updates.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-box-visual-checks
          path: dist/visual/
